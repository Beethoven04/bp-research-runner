# SearXNG for B2B Perfume research. Local only (127.0.0.1). secret_key is filled in at start (data/searxng/).
use_default_settings: true
general:
  instance_name: "bp-research"
server:
  secret_key: "__SECRET__"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"
search:
  formats: [html, json]
  safe_search: 0
outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
